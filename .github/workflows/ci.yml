name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fx_quotes
          POSTGRES_PASSWORD: fx_quotes
          POSTGRES_DB: fx_quotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fx_quotes -d fx_quotes_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fx_quotes:fx_quotes@127.0.0.1:5432/fx_quotes_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Apply test database migrations
        run: |
          docker run --rm --network host \
            -e GOOSE_DRIVER=postgres \
            -e GOOSE_DBSTRING="$TEST_DATABASE_URL" \
            -v "$GITHUB_WORKSPACE/sql/migrations:/migrations:ro" \
            kukymbr/goose-docker:3.27.1
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
